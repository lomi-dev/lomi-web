<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lomi Remote CLI preview render source</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #20241f; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .stage { position: relative; width: 1920px; height: 1200px; overflow: hidden; isolation: isolate; background: #bdd2dd; }
      .wallpaper { position: absolute; inset: 0; z-index: -1; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
      .cli-window {
        position: absolute;
        top: 48%;
        left: 50%;
        width: 80%;
        height: 80%;
        transform: translate(-50%, -50%);
        overflow: hidden;
        border-radius: 22px;
        background: #fbfcfa;
        box-shadow: 0 .2cqw .5cqw rgb(9 30 60 / 22%), 0 2cqw 4cqw -.8cqw rgb(9 30 60 / 35%), 0 5cqw 8cqw -3cqw rgb(9 30 60 / 32%);
      }
      .cli-screen {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 20px;
        width: 100%;
        height: 100%;
        padding: 42px 48px 28px;
        background: #fbfcfa;
        color: #30372f;
        font-size: 20px;
        line-height: 1.55;
      }
      .cli-header { min-width: 0; padding: 0 3px 19px; border-bottom: 1px solid #dfe3dd; }
      .cli-product-line { display: flex; align-items: baseline; gap: 13px; }
      .cli-product-line h1 { margin: 0; color: #171a17; font-size: 27px; font-weight: 500; line-height: 1.4; letter-spacing: -.035em; }
      .cli-version { color: #687164; font-size: 17px; }
      .cli-dashboard { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; min-height: 0; }
      .cli-panel { position: relative; min-width: 0; min-height: 0; padding: 32px 18px 18px; border: 1px solid #d5dbd3; background: #fbfcfa; }
      .cli-panel h2 { position: absolute; top: -.83em; left: 17px; margin: 0; padding: 0 10px; background: #fbfcfa; color: #485145; font-size: 16px; font-weight: 500; line-height: 1.5; }
      .workspace-list { display: grid; gap: 7px; width: 100%; }
      .workspace-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 9px; min-width: 0; min-height: 52px; padding: 8px 12px; color: #50594f; font-size: 18px; line-height: 1.4; }
      .workspace-row.selected { border: 1px solid #dce3d4; background: #f0f4e9; color: #252b23; }
      .workspace-marker { color: #849450; font-size: 23px; line-height: 1; }
      .workspace-marker.empty { color: transparent; }
      .workspace-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workspace-sharing { color: #6c7569; font-size: 15px; white-space: nowrap; }
      .host-workspace-name { margin: 1px 0 24px; color: #20251e; font-size: 20px; line-height: 1.5; }
      .operation-hints { display: flex; flex-wrap: wrap; gap: 9px 24px; margin-top: 31px; padding-top: 19px; border-top: 1px solid #e2e6df; color: #667160; font-size: 16px; line-height: 1.55; }
      .operation-hints span { white-space: nowrap; }
      .cli-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; min-height: 54px; padding: 9px 15px; border: 1px solid #d8ddd6; color: #566052; font-size: 16px; line-height: 1.5; }
      .cli-footer span { white-space: nowrap; }
      .cli-footer kbd { color: #354032; font: inherit; }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Lomi Remote CLI interface preview">
      <img class="wallpaper" src="../../src/assets/product/renders/tahoe-light.jpg" alt="" aria-hidden="true">
      <section class="cli-window" aria-label="Lomi Remote terminal dashboard">
        <div class="cli-screen">
          <header class="cli-header">
            <div class="cli-product-line">
              <h1>Lomi Remote</h1>
              <span class="cli-version">v0.1.0</span>
            </div>
          </header>

          <div class="cli-dashboard">
            <section class="cli-panel" aria-labelledby="workspaces-title">
              <h2 id="workspaces-title">Workspaces</h2>
              <div class="workspace-list">
                <div class="workspace-row selected"><span class="workspace-marker" aria-hidden="true">›</span><span class="workspace-name">api-service</span><span class="workspace-sharing">[Local]</span></div>
                <div class="workspace-row"><span class="workspace-marker empty" aria-hidden="true">›</span><span class="workspace-name">web-app</span><span class="workspace-sharing">[Local]</span></div>
                <div class="workspace-row"><span class="workspace-marker empty" aria-hidden="true">›</span><span class="workspace-name">automation</span><span class="workspace-sharing">[Local]</span></div>
              </div>
            </section>

            <section class="cli-panel" aria-labelledby="local-host-title">
              <h2 id="local-host-title">Local host</h2>
              <p class="host-workspace-name">api-service</p>
              <div class="operation-hints">
                <span>[a] Add existing directory</span>
                <span>[s] Share workspace</span>
              </div>
            </section>
          </div>

          <footer class="cli-footer" aria-label="Terminal keyboard controls">
            <span><kbd>[Up/Down]</kbd> select</span>
            <span><kbd>[Enter]</kbd> details</span>
            <span><kbd>[r]</kbd> refresh</span>
            <span><kbd>[?]</kbd> help</span>
            <span><kbd>[q]</kbd> close</span>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
