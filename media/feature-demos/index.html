<!doctype html>
<html
  lang="en"
  data-resolution="custom"
  data-composition-variables='[
    { "id": "name", "type": "string", "label": "Demo name", "default": "terminal" },
    { "id": "source", "type": "string", "label": "Window recording", "default": "assets/raw/terminal.mp4" },
    { "id": "sourceWidth", "type": "number", "label": "Recording width", "default": 1920, "min": 1, "step": 1, "unit": "px" },
    { "id": "sourceHeight", "type": "number", "label": "Recording height", "default": 1200, "min": 1, "step": 1, "unit": "px" },
    { "id": "duration", "type": "number", "label": "Demo duration", "default": 8.4, "min": 1, "step": 0.1, "unit": "s" },
    { "id": "focusX", "type": "number", "label": "Focus X", "default": 0.5, "min": 0, "max": 1, "step": 0.01 },
    { "id": "focusY", "type": "number", "label": "Focus Y", "default": 0.5, "min": 0, "max": 1, "step": 0.01 },
    { "id": "zoom", "type": "number", "label": "Focus scale", "default": 1, "min": 1, "max": 1.24, "step": 0.01 },
    { "id": "zoomInStart", "type": "number", "label": "Focus move starts", "default": 3, "min": 0, "max": 10.5, "step": 0.05, "unit": "s" },
    { "id": "zoomInEnd", "type": "number", "label": "Focus move ends", "default": 3.3, "min": 0.05, "max": 10.5, "step": 0.05, "unit": "s" },
    { "id": "pullbackStart", "type": "number", "label": "Pullback starts", "default": 5.104, "min": 0, "max": 10.5, "step": 0.05, "unit": "s" },
    { "id": "pullbackEnd", "type": "number", "label": "Pullback ends", "default": 8.1, "min": 0.05, "max": 11.4, "step": 0.05, "unit": "s" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1600px;
        height: 1000px;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #root {
        position: relative;
        width: 1600px;
        height: 1000px;
        overflow: hidden;
        container-type: size;
      }

      #wallpaper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      #app-camera {
        position: absolute;
        width: 80%;
        left: 10%;
        top: 10%;
        overflow: hidden;
        border: 0;
        outline: 0;
        border-radius: 1.15cqw;
        transform-origin: 50% 50%;
        will-change: transform;
        box-shadow: 0 24px 72px rgb(0 0 0 / 34%), 0 4px 16px rgb(0 0 0 / 24%);
      }

      #feature-footage {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-1u5w"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.4"
      data-fps="30"
      data-width="1600"
      data-height="1000"
    >
      <img data-hf-id="hf-j22f"
        id="wallpaper"
        class="clip"
        data-start="0"
        data-duration="8.4"
        data-track-index="0"
        src="assets/tahoe-light.jpg"
        alt=""
      />
      <div data-hf-id="hf-su1n" id="app-camera" data-layout-allow-overflow>
        <video data-hf-id="hf-qn0w"
          id="feature-footage"
          class="clip"
          data-start="0"
          data-duration="8.4"
          data-track-index="0"
          data-var-src="source"
          src="assets/raw/terminal.mp4"
          muted
          playsinline
        ></video>
      </div>
    </div>
    <script>
      const variables = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      const camera = document.getElementById("app-camera");
      const wallpaper = document.getElementById("wallpaper");
      const footage = document.getElementById("feature-footage");
      const number = (key, fallback) => {
        const value = Number(variables[key]);
        return Number.isFinite(value) ? value : fallback;
      };

      const canvasWidth = root.clientWidth;
      const canvasHeight = root.clientHeight;
      const duration = Math.max(0.1, number("duration", 8.4));
      const sourceWidth = Math.max(1, Number(variables.sourceWidth) || 1920);
      const sourceHeight = Math.max(1, Number(variables.sourceHeight) || 1200);
      root.dataset.duration = String(duration);
      wallpaper.dataset.duration = String(duration);
      footage.dataset.duration = String(duration);
      const cameraWidth = canvasWidth * 0.8;
      const cameraHeight = cameraWidth * (sourceHeight / sourceWidth);
      camera.style.width = `${cameraWidth}px`;
      camera.style.height = `${cameraHeight}px`;
      camera.style.left = `${(canvasWidth - cameraWidth) / 2}px`;
      camera.style.top = `${(canvasHeight - cameraHeight) / 2}px`;

      const focusX = Math.min(1, Math.max(0, number("focusX", 0.5)));
      const focusY = Math.min(1, Math.max(0, number("focusY", 0.5)));
      const zoom = Math.min(1.24, Math.max(1, number("zoom", 1)));
      const zoomInStart = number("zoomInStart", 0);
      const zoomInEnd = number("zoomInEnd", 0);
      const pullbackStart = number("pullbackStart", duration);
      const pullbackEnd = number("pullbackEnd", duration);

      const focusXOffset = (focusX - 0.5) * cameraWidth;
      const focusYOffset = (focusY - 0.5) * cameraHeight;
      const focusedX = -focusXOffset * (zoom - 1);
      const focusedY = -focusYOffset * (zoom - 1);

      gsap.set(camera, { x: 0, y: 0, scale: 1, transformOrigin: "50% 50%" });
      const timeline = gsap.timeline({ paused: true });
      if (zoom > 1) {
        timeline.to(
          camera,
          {
            x: focusedX,
            y: focusedY,
            scale: zoom,
            duration: zoomInEnd - zoomInStart,
            ease: "power2.inOut",
          },
          zoomInStart,
        );
        timeline.to(
          camera,
          {
            x: 0,
            y: 0,
            scale: 1,
            duration: pullbackEnd - pullbackStart,
            ease: "power2.inOut",
          },
          pullbackStart,
        );
      } else {
        timeline.to(camera, { x: 0, y: 0, scale: 1, duration, ease: "none" }, 0);
      }

      window.__timelines = window.__timelines || {};
      window.__timelines.main = timeline;
      timeline.seek(0);
    </script>
  </body>
</html>
